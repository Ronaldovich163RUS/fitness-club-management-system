spring.application.name=fitness-club
spring.devtools.restart.poll-interval=2s
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/fitness_club?serverTimezone=Europe/Samara
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.initialization-mode=always
spring.thymeleaf.cache=false

# Настройки логирования
logging.level.org.springframework.jdbc.core=INFO
logging.level.com.fitnessclub=INFO

# Настройки JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JSON REST: snake_case как в БД и фронтенде
spring.jackson.property-naming-strategy=SNAKE_CASE
# Часовой пояс для JSON задаётся в ApplicationTimeConfiguration (ClubZone — Самара)

# Настройки Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Email Configuration
spring.mail.host=smtp.yandex.ru
spring.mail.port=465
spring.mail.username=anatoliy2004RUS@yandex.ru
spring.mail.password=dautwwcmccwwqlie
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.yandex.ru
spring.mail.properties.mail.debug=true

