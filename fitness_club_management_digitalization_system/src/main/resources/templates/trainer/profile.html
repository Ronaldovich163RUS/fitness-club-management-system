<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Тренер — персональные данные</title>
	<link rel="stylesheet" href="/css/base.css" th:href="@{/css/base.css}">
	<link rel="stylesheet" href="/css/admin.css" th:href="@{/css/admin.css}">
</head>
<body>
	<div th:replace="~{fragments/trainer-header :: trainer-header('profile')}"></div>

	<main class="container admin-page">
		<h1 class="page-title" style="margin-top: 34px;">Мои персональные данные</h1>

		<section class="card" style="padding: 20px;">
			<form id="trainer-profile-form" class="admin-form-grid" novalidate>
				<input type="hidden" id="trainer_id">
				<input type="hidden" id="personal_data_id">
				<div class="admin-field">
					<label for="last_name">Фамилия</label>
					<input id="last_name" class="field" required>
				</div>
				<div class="admin-field">
					<label for="first_name">Имя</label>
					<input id="first_name" class="field" required>
				</div>
				<div class="admin-field">
					<label for="middle_name">Отчество</label>
					<input id="middle_name" class="field">
				</div>
				<div class="admin-field">
					<label for="birth_date">Дата рождения</label>
					<input id="birth_date" class="field" type="date" required>
				</div>
				<div class="admin-field">
					<label for="phone">Телефон</label>
					<input id="phone" class="field" required>
				</div>
				<div class="admin-field">
					<label for="email">Email</label>
					<input id="email" class="field" type="email" required>
				</div>
				<div class="admin-field">
					<label for="gender">Пол</label>
					<select id="gender" class="field" disabled>
						<option value="Мужской">Мужской</option>
						<option value="Женский">Женский</option>
					</select>
				</div>
				<div class="admin-field span-2">
					<label for="registration_address">Адрес регистрации</label>
					<input id="registration_address" class="field">
				</div>
				<div class="admin-field span-2">
					<label for="actual_address">Фактический адрес</label>
					<input id="actual_address" class="field">
				</div>
				<div style="grid-column: 1 / -1; display:flex; gap:10px;">
					<button type="submit" class="admin-btn primary">Сохранить</button>
				</div>
			</form>
		</section>
	</main>

	<script src="/js/club-datetime.js" th:src="@{/js/club-datetime.js}"></script>
	<script src="/js/client-data.js" th:src="@{/js/client-data.js}"></script>
	<script src="/js/trainer-profile.js" th:src="@{/js/trainer-profile.js}"></script>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
