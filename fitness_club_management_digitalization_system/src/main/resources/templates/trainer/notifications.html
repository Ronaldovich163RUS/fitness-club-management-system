<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Тренер — уведомления клиентам</title>
	<link rel="stylesheet" href="/css/base.css" th:href="@{/css/base.css}">
	<link rel="stylesheet" href="/css/admin.css" th:href="@{/css/admin.css}">
</head>
<body>
	<div th:replace="~{fragments/trainer-header :: trainer-header('notifications')}"></div>

	<main class="container admin-page">
		<h1 class="page-title" style="margin-top: 34px;">Уведомления клиентам</h1>

		<section class="card" style="padding: 20px; margin-bottom: 24px;">
			<div class="admin-field">
				<label for="trainer-client-id">Клиент</label>
				<select id="trainer-client-id" class="field"></select>
			</div>
		</section>

		<section class="card" style="padding: 20px;">
			<div class="section-title" style="margin-bottom: 12px;">Отправить уведомление клиенту</div>
			<form id="trainer-notification-form" class="admin-form-grid" novalidate>
				<div class="admin-field span-2">
					<label for="notification_title">Заголовок</label>
					<input id="notification_title" class="field" required maxlength="200">
				</div>
				<div class="admin-field span-2">
					<label for="notification_message">Сообщение</label>
					<textarea id="notification_message" class="field" rows="4" required style="resize: vertical;"></textarea>
				</div>
				<div style="grid-column:1 / -1; display:flex; gap:10px;">
					<button type="submit" class="admin-btn primary">Отправить</button>
				</div>
			</form>
		</section>
	</main>

	<script src="/js/club-datetime.js" th:src="@{/js/club-datetime.js}"></script>
	<script src="/js/client-data.js" th:src="@{/js/client-data.js}"></script>
	<script src="/js/trainer-notifications.js" th:src="@{/js/trainer-notifications.js}"></script>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
