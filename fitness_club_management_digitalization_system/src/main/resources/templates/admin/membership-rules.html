<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Админ: правила посещений</title>
	<link rel="stylesheet" href="/css/base.css" th:href="@{/css/base.css}">
	<link rel="stylesheet" href="/css/admin.css" th:href="@{/css/admin.css}">
</head>

<body th:attr="data-api-base=@{/api/admin}">
	<div th:replace="~{fragments/admin-header :: admin-header('rules')}"></div>

	<main class="container admin-page">
		<h1 class="page-title" style="margin-top: 34px;">Правила посещений</h1>

		<div id="rule-load-error" class="admin-alert admin-alert--error" style="display:none;" role="alert"></div>

		<div class="card admin-toolbar" aria-label="Форма поиска правил">
			<div class="admin-field">
				<label for="q-membership">Абонемент</label>
				<select id="q-membership" class="field">
					<option value="">Все</option>
				</select>
			</div>
			<div class="admin-field">
				<label for="q-service">Услуга</label>
				<select id="q-service" class="field">
					<option value="">Все</option>
				</select>
			</div>
			<div class="admin-actions">
				<button id="btn-search" type="button" class="admin-btn primary">Найти</button>
				<button id="btn-clear-search" type="button" class="admin-btn secondary">Сбросить</button>
			</div>
		</div>

		<div class="admin-table-wrap card" style="padding: 14px;">
			<table class="admin-table" aria-label="Таблица правил посещений">
				<thead>
					<tr>
						<th>Абонемент</th>
						<th>Услуга</th>
						<th>Включённые посещения</th>
						<th>Макс. в неделю</th>
						<th>Дни недели</th>
						<th>Время начала</th>
						<th>Время окончания</th>
						<th>Действия</th>
					</tr>
				</thead>
				<tbody id="rules-tbody"></tbody>
			</table>
		</div>

		<div class="card" style="padding: 14px;">
			<div class="section-title" style="margin: 0 0 10px;">Добавление / редактирование правила</div>
			<form id="ruleForm" novalidate>
				<input type="hidden" id="membership_service_id" />

				<div class="admin-form-grid">
					<div>
						<label for="membership_id" style="display:block;margin-bottom:8px;font-weight:900;">Абонемент</label>
						<select id="membership_id" class="field" required></select>
					</div>
					<div>
						<label for="service_id" style="display:block;margin-bottom:8px;font-weight:900;">Услуга</label>
						<select id="service_id" class="field" required></select>
					</div>
					<div>
						<label for="included_visits" style="display:block;margin-bottom:8px;font-weight:900;">Включённые посещения (пусто — безлимит)</label>
						<input id="included_visits" class="field" type="number" min="0" step="1" placeholder="Безлимит" />
					</div>
					<div>
						<label for="max_per_week" style="display:block;margin-bottom:8px;font-weight:900;">Максимум в неделю (пусто — без ограничения)</label>
						<input id="max_per_week" class="field" type="number" min="1" step="1" placeholder="Без ограничения" />
					</div>

					<div class="span-2">
						<div class="admin-small">Дни недели</div>
						<div class="admin-checkboxes" id="days-checkboxes">
							<label><input type="checkbox" value="пн"> пн</label>
							<label><input type="checkbox" value="вт"> вт</label>
							<label><input type="checkbox" value="ср"> ср</label>
							<label><input type="checkbox" value="чт"> чт</label>
							<label><input type="checkbox" value="пт"> пт</label>
							<label><input type="checkbox" value="сб"> сб</label>
							<label><input type="checkbox" value="вс"> вс</label>
						</div>
					</div>

					<div>
						<label for="time_start" style="display:block;margin-bottom:8px;font-weight:900;">Время начала</label>
						<input id="time_start" class="field" type="time" min="06:00" max="23:00" step="60" />
					</div>
					<div>
						<label for="time_end" style="display:block;margin-bottom:8px;font-weight:900;">Время окончания</label>
						<input id="time_end" class="field" type="time" min="00:00" max="23:59" step="60" />
						<div class="admin-small">Начало: 06:00–23:00. Окончание: 07:00–23:59 (позже начала) или 00:00 (полночь); при начале в 23:00 — только окончание 00:00.</div>
					</div>
				</div>

				<div class="admin-actions" style="margin-top: 14px;">
					<button id="btn-save-rule" type="submit" class="admin-btn primary">Сохранить правило</button>
					<button id="btn-reset-rule" type="button" class="admin-btn secondary">Очистить</button>
				</div>

				<div id="ruleFormError" class="admin-alert admin-alert--error" style="display:none;" role="alert"></div>
			</form>
		</div>
	</main>

	<script src="/js/admin-membership-rules.js" th:src="@{/js/admin-membership-rules.js}"></script>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
