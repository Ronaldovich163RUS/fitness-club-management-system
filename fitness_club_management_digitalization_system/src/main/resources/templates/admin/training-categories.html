<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Админ: услуги</title>
	<link rel="stylesheet" href="/css/base.css" th:href="@{/css/base.css}">
	<link rel="stylesheet" href="/css/admin.css" th:href="@{/css/admin.css}">
</head>

<body th:attr="data-api-base=@{/api/admin}">
	<div th:replace="~{fragments/admin-header :: admin-header('categories')}"></div>

	<main class="container admin-page">
		<h1 class="page-title" style="margin-top: 34px;">Услуги</h1>

		<div class="card admin-toolbar" aria-label="Поиск услуг">
			<div class="admin-field">
				<label for="q-service-name">Название услуги</label>
				<input id="q-service-name" class="field" type="text" placeholder="Напр.: Йога (Hatha)" />
			</div>
			<div class="admin-field">
				<label for="q-zone">Зона</label>
				<select id="q-zone" class="field">
					<option value="">Все</option>
				</select>
			</div>
			<div class="admin-field">
				<label for="q-service-type">Тип услуги</label>
				<select id="q-service-type" class="field">
					<option value="">Все</option>
					<option value="групповая тренировка">Групповая тренировка</option>
					<option value="персональная тренировка">Персональная тренировка</option>
					<option value="доступ в зону">Доступ в зону</option>
					<option value="дополнительная услуга">Дополнительная услуга</option>
				</select>
			</div>
			<div class="admin-actions">
				<button id="btn-search" type="button" class="admin-btn primary">Найти</button>
				<button id="btn-clear-search" type="button" class="admin-btn secondary">Сбросить</button>
			</div>
		</div>

		<div class="admin-table-wrap card" style="padding: 14px;">
			<table class="admin-table" aria-label="Таблица услуг">
				<thead>
					<tr>
						<th>Название</th>
						<th>Тип</th>
						<th>Длительность</th>
						<th>Базовая цена</th>
						<th>Зона</th>
						<th>Активен</th>
						<th>Действия</th>
					</tr>
				</thead>
				<tbody id="services-tbody"></tbody>
			</table>
		</div>

		<div class="card" style="padding: 14px;">
			<div class="section-title" style="margin: 0 0 10px;">Добавление / редактирование</div>
			<form id="serviceForm" novalidate>
				<input type="hidden" id="service_id" />

				<div class="admin-form-grid">
					<div>
						<label style="display:block;margin-bottom:8px;font-weight:900;">Название услуги</label>
						<input id="service_name" class="field" type="text" required placeholder="Пилатес" />
					</div>
					<div>
						<label style="display:block;margin-bottom:8px;font-weight:900;">Тип услуги</label>
						<select id="service_type" class="field" required>
							<option value="групповая тренировка">Групповая тренировка</option>
							<option value="персональная тренировка">Персональная тренировка</option>
							<option value="доступ в зону">Доступ в зону</option>
							<option value="дополнительная услуга">Дополнительная услуга</option>
						</select>
					</div>
					<div>
						<label style="display:block;margin-bottom:8px;font-weight:900;">Длительность (минуты)</label>
						<input id="duration_minutes" class="field" type="number" required min="0" step="5" />
					</div>
					<div>
						<label style="display:block;margin-bottom:8px;font-weight:900;">Базовая цена</label>
						<input id="base_price" class="field" type="number" required min="0" step="10" />
					</div>
					<div>
						<label style="display:block;margin-bottom:8px;font-weight:900;">Зона</label>
						<select id="zone_id" class="field" required></select>
					</div>
					<div class="span-2">
						<label style="display:block;margin-bottom:8px;font-weight:900;">Описание</label>
						<textarea id="description" class="field" rows="3" required placeholder="Описание тренировки"></textarea>
					</div>
					<div>
						<label style="display:block;margin-bottom:8px;font-weight:900;">Активна</label>
						<select id="is_active" class="field" required>
							<option value="true">Да</option>
							<option value="false">Нет</option>
						</select>
					</div>
					<div class="span-2">
						<div class="admin-divider"></div>
						<div style="margin: 12px 0 8px; font-weight: 900;">Какие типы абонементов включают эту категорию</div>
						<div class="admin-checkboxes" id="membership-checkboxes"></div>
					</div>
				</div>

				<div class="admin-actions" style="margin-top: 14px;">
					<button id="btn-save-service" type="submit" class="admin-btn primary">Сохранить</button>
					<button id="btn-reset-service" type="button" class="admin-btn secondary">Очистить</button>
				</div>

				<div id="serviceFormError" class="error-message" style="display:none;margin-top:12px;"></div>
			</form>
		</div>
	</main>

	<script src="/js/admin-training-categories.js" th:src="@{/js/admin-training-categories.js}"></script>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
