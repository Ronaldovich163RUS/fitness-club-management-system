<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Админ: залы</title>
	<link rel="stylesheet" href="/css/base.css" th:href="@{/css/base.css}">
	<link rel="stylesheet" href="/css/admin.css" th:href="@{/css/admin.css}">
</head>

<body th:attr="data-api-base=@{/api/admin}">
	<div th:replace="~{fragments/admin-header :: admin-header('halls')}"></div>

	<main class="container admin-page">
		<h1 class="page-title" style="margin-top: 34px;">Залы</h1>

		<section class="card" style="padding: 14px;">
			<div class="card admin-toolbar" aria-label="Поиск залов" style="margin: 0 0 14px;">
				<div class="admin-field">
					<label for="q-hall-name">Название зала</label>
					<input id="q-hall-name" class="field" type="text" placeholder="Напр.: Main Hall" />
				</div>
				<div class="admin-field">
					<label for="q-hall-is_active">Активен</label>
					<select id="q-hall-is_active" class="field">
						<option value="">Любой</option>
						<option value="true">Да</option>
						<option value="false">Нет</option>
					</select>
				</div>
				<div class="admin-actions">
					<button id="btn-hall-search" type="button" class="admin-btn primary">Найти</button>
					<button id="btn-clear-hall-search" type="button" class="admin-btn secondary">Сбросить</button>
				</div>
			</div>

			<div class="admin-table-wrap card" style="padding: 14px; margin-bottom: 14px;">
				<table class="admin-table" aria-label="Таблица залов">
					<thead>
						<tr>
							<th>Название</th>
							<th>Зона</th>
							<th>Вместимость</th>
							<th>Описание</th>
							<th>Активен</th>
							<th>Действия</th>
						</tr>
					</thead>
					<tbody id="halls-tbody"></tbody>
				</table>
			</div>

			<div class="card" style="padding: 14px;">
				<div class="section-title" style="margin: 0 0 10px;">Добавление / редактирование зала</div>
				<form id="hallForm" novalidate>
					<input type="hidden" id="hall_id" />
					<div class="admin-form-grid">
						<div>
							<label style="display:block;margin-bottom:8px;font-weight:900;">Название зала</label>
							<input id="hall_name" class="field" type="text" required maxlength="100" placeholder="Main Hall" />
						</div>
						<div>
							<label style="display:block;margin-bottom:8px;font-weight:900;">Зона</label>
							<select id="hall_zone_id" class="field">
								<option value="">— Не привязана —</option>
							</select>
						</div>
						<div>
							<label style="display:block;margin-bottom:8px;font-weight:900;">Вместимость</label>
							<input id="capacity" class="field" type="number" required min="1" step="1" placeholder="100" />
						</div>
						<div class="span-2">
							<label style="display:block;margin-bottom:8px;font-weight:900;">Описание</label>
							<textarea id="hall_description" class="field" rows="3" maxlength="1000" placeholder="Короткое описание зала" style="resize: vertical;"></textarea>
						</div>
						<div>
							<label style="display:block;margin-bottom:8px;font-weight:900;">Активен</label>
							<select id="hall_is_active" class="field" required>
								<option value="true">Да</option>
								<option value="false">Нет</option>
							</select>
						</div>
					</div>
					<div class="admin-actions" style="margin-top: 14px;">
						<button id="btn-save-hall" type="submit" class="admin-btn primary">Сохранить зал</button>
						<button id="btn-reset-hall" type="button" class="admin-btn secondary">Очистить форму</button>
					</div>
					<div id="hallFormError" class="error-message" style="display:none;margin-top:12px;"></div>
				</form>
			</div>
		</section>
	</main>

	<script src="/js/admin-halls.js" th:src="@{/js/admin-halls.js}"></script>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
