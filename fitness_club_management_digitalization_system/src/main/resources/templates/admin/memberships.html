<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Админ: абонементы</title>
	<link rel="stylesheet" href="/css/base.css" th:href="@{/css/base.css}">
	<link rel="stylesheet" href="/css/admin.css" th:href="@{/css/admin.css}">
</head>

<body th:attr="data-api-base=@{/api/admin}">
	<div th:replace="~{fragments/admin-header :: admin-header('memberships')}"></div>

	<main class="container admin-page">
		<h1 class="page-title" style="margin-top: 34px;">Типы абонементов</h1>

		<div id="membership-load-error" class="admin-alert admin-alert--error" style="display:none;" role="alert"></div>

		<div class="card admin-toolbar" aria-label="Поиск абонементов">
			<div class="admin-field">
				<label for="q-name">Название</label>
				<input id="q-name" class="field" type="text" placeholder="Напр.: Active90" />
			</div>
			<div class="admin-actions">
				<button id="btn-search" type="button" class="admin-btn primary">Найти</button>
				<button id="btn-clear-search" type="button" class="admin-btn secondary">Сбросить</button>
			</div>
		</div>

		<div class="admin-table-wrap card" style="padding: 14px;">
			<table class="admin-table" aria-label="Таблица абонементов">
				<thead>
					<tr>
						<th>Название</th>
						<th>Цена</th>
						<th>Срок (дней)</th>
						<th>Лимит посещений</th>
						<th>Заморозка</th>
						<th>Гостевые</th>
						<th>Парковка</th>
						<th>Полотенце</th>
						<th>Активен</th>
						<th>Действия</th>
					</tr>
				</thead>
				<tbody id="memberships-tbody"></tbody>
			</table>
		</div>

		<div class="card" style="padding: 14px;">
			<div class="section-title" style="margin: 0 0 10px;">Добавление / редактирование</div>
			<form id="membershipForm" novalidate>
				<input type="hidden" id="membership_id" />

				<div class="admin-form-grid">
					<div>
						<label for="membership_name" style="display:block;margin-bottom:8px;font-weight:900;">Название</label>
						<input id="membership_name" class="field" type="text" required maxlength="50"
							title="Только буквы и цифры, до 50 символов" placeholder="Например Active90" />
					</div>
					<div>
						<label for="price" style="display:block;margin-bottom:8px;font-weight:900;">Цена (руб.)</label>
						<input id="price" class="field" type="number" required min="0" max="1000000" step="1" />
					</div>
					<div>
						<label for="duration_days" style="display:block;margin-bottom:8px;font-weight:900;">Срок (дней)</label>
						<input id="duration_days" class="field" type="number" required min="1" max="1825" step="1" />
					</div>
					<div>
						<label for="visits_limit" style="display:block;margin-bottom:8px;font-weight:900;">Лимит посещений (необязательно)</label>
						<input id="visits_limit" class="field" type="number" min="0" step="1" placeholder="Пусто — безлимит" />
					</div>
					<div>
						<label for="freeze_days" style="display:block;margin-bottom:8px;font-weight:900;">Заморозка (дней)</label>
						<input id="freeze_days" class="field" type="number" min="0" max="365" step="1" placeholder="0" />
					</div>
					<div>
						<label for="guest_visits" style="display:block;margin-bottom:8px;font-weight:900;">Гостевые визиты</label>
						<input id="guest_visits" class="field" type="number" min="0" step="1" placeholder="0" />
					</div>
					<div>
						<label for="parking" style="display:block;margin-bottom:8px;font-weight:900;">Парковка</label>
						<select id="parking" class="field" required>
							<option value="false">Нет</option>
							<option value="true">Да</option>
						</select>
					</div>
					<div>
						<label for="towel" style="display:block;margin-bottom:8px;font-weight:900;">Полотенце</label>
						<select id="towel" class="field" required>
							<option value="false">Нет</option>
							<option value="true">Да</option>
						</select>
					</div>
					<div class="span-2">
						<label for="description" style="display:block;margin-bottom:8px;font-weight:900;">Описание</label>
						<textarea id="description" class="field" rows="3" required maxlength="100"
							title="Буквы, цифры, пробелы и знаки . , ; : — до 100 символов" placeholder="Краткое описание"></textarea>
					</div>
					<div class="span-2">
						<div class="admin-divider"></div>
						<div style="margin: 12px 0 8px; font-weight: 900;">Связанные услуги</div>
						<div class="admin-checkboxes" id="membership-services-checkboxes"></div>
					</div>
					<div>
						<label for="is_active" style="display:block;margin-bottom:8px;font-weight:900;">Активен</label>
						<select id="is_active" class="field" required>
							<option value="true">Да</option>
							<option value="false">Нет</option>
						</select>
					</div>
				</div>

				<div class="admin-actions" style="margin-top: 14px;">
					<button id="btn-save-membership" type="submit" class="admin-btn primary">Сохранить</button>
					<button id="btn-reset-membership" type="button" class="admin-btn secondary">Очистить</button>
				</div>

				<div id="membershipFormError" class="admin-alert admin-alert--error" style="display:none;" role="alert"></div>
			</form>
		</div>
	</main>

	<script src="/js/admin-memberships.js" th:src="@{/js/admin-memberships.js}"></script>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
