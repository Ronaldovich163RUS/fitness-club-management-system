<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Админ: зоны</title>
	<link rel="stylesheet" href="/css/base.css" th:href="@{/css/base.css}">
	<link rel="stylesheet" href="/css/admin.css" th:href="@{/css/admin.css}">
</head>

<body th:attr="data-api-base=@{/api/admin}">
	<div th:replace="~{fragments/admin-header :: admin-header('zones')}"></div>

	<main class="container admin-page">
		<h1 class="page-title" style="margin-top: 34px;">Зоны</h1>

		<section class="card" style="padding: 14px;">
			<div class="card admin-toolbar" aria-label="Поиск зон" style="margin: 0 0 14px;">
				<div class="admin-field">
					<label for="q-zone-name">Название зоны</label>
					<input id="q-zone-name" class="field" type="text" placeholder="Напр.: Functional" />
				</div>
				<div class="admin-actions">
					<button id="btn-zone-search" type="button" class="admin-btn primary">Найти</button>
					<button id="btn-clear-zone-search" type="button" class="admin-btn secondary">Сбросить</button>
				</div>
			</div>

			<div class="admin-table-wrap card" style="padding: 14px; margin-bottom: 14px;">
				<table class="admin-table" aria-label="Таблица зон">
					<thead>
						<tr>
							<th>Название</th>
							<th>Описание</th>
							<th>Действия</th>
						</tr>
					</thead>
					<tbody id="zones-tbody"></tbody>
				</table>
			</div>

			<div class="card" style="padding: 14px;">
				<div class="section-title" style="margin: 0 0 10px;">Добавление / редактирование зоны</div>
				<form id="zoneForm" novalidate>
					<input type="hidden" id="zone_id" />
					<div class="admin-form-grid">
						<div>
							<label style="display:block;margin-bottom:8px;font-weight:900;">Название зоны</label>
							<input id="zone_name" class="field" type="text" required maxlength="50" placeholder="Functional" />
						</div>
						<div class="span-2">
							<label style="display:block;margin-bottom:8px;font-weight:900;">Описание</label>
							<textarea id="zone_description" class="field" rows="3" maxlength="1000" placeholder="Короткое описание зоны" style="resize: vertical;"></textarea>
						</div>
					</div>
					<div class="admin-actions" style="margin-top: 14px;">
						<button id="btn-save-zone" type="submit" class="admin-btn primary">Сохранить зону</button>
						<button id="btn-reset-zone" type="button" class="admin-btn secondary">Очистить форму</button>
					</div>
					<div id="zoneFormError" class="error-message" style="display:none;margin-top:12px;"></div>
				</form>
			</div>
		</section>
	</main>

	<script src="/js/admin-zones.js" th:src="@{/js/admin-zones.js}"></script>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
