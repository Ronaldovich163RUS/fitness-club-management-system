<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Авторизация</title>
	<link rel="stylesheet" href="/css/base.css" th:href="@{/css/base.css}">
	<link rel="stylesheet" href="/css/admin.css" th:href="@{/css/admin.css}">
	<link rel="stylesheet" href="/css/auth.css" th:href="@{/css/auth.css}">
</head>

<body>
	<div th:replace="~{fragments/default-header :: default-header('login')}"></div>

	<main class="container auth-container">
		<div class="auth-card card" aria-label="Форма входа">
			<h1 class="page-title">Вход в личный кабинет</h1>

			<form id="loginForm" class="auth-form" action="/login" method="post" novalidate>
				<div class="auth-error-slot">
					<div id="loginFormError" class="admin-alert admin-alert--error" role="alert"></div>
				</div>
				<div class="form-group">
					<label for="login">Email</label>
					<input id="login" class="field" type="email" name="login" required autocomplete="email"
						placeholder="Введите email" />
				</div>

				<div class="form-group">
					<label for="password">Пароль</label>
					<input id="password" class="field" type="password" name="password" required minlength="8"
						autocomplete="current-password" placeholder="Введите пароль" />
				</div>

				<button type="submit" id="auth-btn" class="btn auth-btn">Войти</button>

				<div class="auth-links">
					<a th:href="@{/register}" href="/register">Нет аккаутнта, зарегистрироваться</a>
				</div>
			</form>
		</div>
	</main>

	<div id="role-select-overlay" class="admin-modal-overlay" hidden aria-hidden="true">
		<div class="admin-modal-backdrop" aria-hidden="true"></div>
		<div class="admin-modal-stack">
			<div class="admin-modal admin-modal--menu" role="dialog" aria-labelledby="role-select-title">
				<div class="admin-modal-header">
					<h2 id="role-select-title" class="admin-modal-title">Выбор роли</h2>
				</div>
				<p class="admin-modal-lead" style="margin-top: 16px; margin-bottom: 28px;">У данного пользователя доступно несколько ролей. Выберите роль для входа.</p>
				<form id="role-select-form" action="/login/role" method="post" class="admin-actions role-select-actions" style="justify-content:flex-start;">
					<button type="submit" name="role" value="TRAINER" class="admin-btn primary role-select-btn">Войти как тренер</button>
					<button type="submit" name="role" value="CLIENT" class="admin-btn primary role-select-btn">Войти как клиент</button>
				</form>
			</div>
		</div>
	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>

	<script src="/js/login.js" th:src="@{/js/login.js}"></script>
</body>

</html>
