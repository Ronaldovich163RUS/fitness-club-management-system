<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Покупка абонементов</title>
	<link rel="stylesheet" href="/css/base.css" th:href="@{/css/base.css}">
	<link rel="stylesheet" href="/css/admin.css" th:href="@{/css/admin.css}">
	<link rel="stylesheet" href="/css/offers.css" th:href="@{/css/offers.css}">
</head>
<body th:attr="data-api-base=@{/api/client}">
	<div th:replace="~{fragments/client-header :: client-header('buy-memberships')}"></div>

	<main class="container">
		<h1 class="page-title" style="margin-top: 34px;">Купить абонементы</h1>

		<section>
			<div id="membership-cards" class="grid" aria-label="Абонементы"></div>
		</section>
		<div id="purchaseError" class="admin-alert admin-alert--error" style="display:none;" role="alert"></div>
	</main>

	<div id="client-modal-root" class="admin-modal-overlay" hidden aria-hidden="true">
		<div class="admin-modal-backdrop" data-modal-dismiss="root" aria-hidden="true"></div>
		<div class="admin-modal-stack">
			<div id="membership-rules-modal" class="admin-modal admin-modal--wide" role="dialog" hidden aria-labelledby="membership-rules-title">
				<div class="admin-modal-header">
					<h2 id="membership-rules-title" class="admin-modal-title">Услуги по абонементу и правила пользования</h2>
					<button type="button" class="admin-modal-close" data-modal-dismiss="root" aria-label="Закрыть">×</button>
				</div>
				<div class="admin-table-wrap">
					<table class="admin-table">
						<thead>
							<tr>
								<th>Услуга</th>
								<th>Включено посещений</th>
								<th>Остаток</th>
								<th>Макс. в неделю</th>
								<th>Дни недели</th>
								<th>Время с</th>
								<th>Время по</th>
							</tr>
						</thead>
						<tbody id="membership-rules-tbody"></tbody>
					</table>
				</div>
			</div>
		</div>
	</div>

	<script src="/js/club-datetime.js" th:src="@{/js/club-datetime.js}"></script>
	<script src="/js/client-purchases.js" th:src="@{/js/client-purchases.js}"></script>

	<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
