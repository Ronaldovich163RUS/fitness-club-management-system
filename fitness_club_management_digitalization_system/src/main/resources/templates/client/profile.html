<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Клиент — персональные данные</title>
	<link rel="stylesheet" href="/css/base.css" th:href="@{/css/base.css}">
	<link rel="stylesheet" href="/css/admin.css" th:href="@{/css/admin.css}">
</head>
<body th:attr="data-api-base=@{/api/client}">
	<div th:replace="~{fragments/client-header :: client-header('profile')}"></div>

	<main class="container admin-page">
		<h1 class="page-title" style="margin-top: 34px;">Персональные данные</h1>

		<section class="card" style="padding: 20px; margin-bottom: 24px;">
			<form id="profile-form" class="admin-form-grid" novalidate>
				<input type="hidden" id="personal_data_id">
				<div class="admin-field">
					<label for="last_name">Фамилия</label>
					<input id="last_name" class="field" required>
				</div>
				<div class="admin-field">
					<label for="first_name">Имя</label>
					<input id="first_name" class="field" required>
				</div>
				<div class="admin-field">
					<label for="middle_name">Отчество</label>
					<input id="middle_name" class="field">
				</div>
				<div class="admin-field">
					<label for="birth_date">Дата рождения</label>
					<input id="birth_date" class="field" type="date" required>
				</div>
				<div class="admin-field">
					<label for="phone">Телефон</label>
					<input id="phone" class="field" required>
				</div>
				<div class="admin-field">
					<label for="email">Email</label>
					<input id="email" class="field" type="email" required>
				</div>
				<div class="admin-field">
					<label for="gender">Пол</label>
					<select id="gender" class="field" disabled>
						<option value="Мужской">Мужской</option>
						<option value="Женский">Женский</option>
					</select>
				</div>
				<div class="admin-field">
					<label for="registration_address">Адрес регистрации</label>
					<input id="registration_address" class="field">
				</div>
				<div class="admin-field">
					<label for="actual_address">Фактический адрес</label>
					<input id="actual_address" class="field">
				</div>
				<div class="admin-actions fixed-form-actions" style="grid-column: 1 / -1; margin-top: 6px;">
					<button type="submit" class="admin-btn primary">Сохранить</button>
				</div>
			</form>
		</section>

		<section id="documents-card" class="card admin-documents-block" style="padding: 20px; margin-bottom: 24px;">
			<div class="section-title" style="margin: 0 0 10px;">Документы</div>
			<div class="admin-table-wrap" style="margin-bottom: 24px;">
				<table class="admin-table" aria-label="Документы">
					<thead>
						<tr>
							<th>Тип</th>
							<th>Серия</th>
							<th>Номер</th>
							<th>Кем выдан</th>
							<th>Дата выдачи</th>
							<th>Срок действия</th>
							<th>Проверен</th>
							<th>Действия</th>
						</tr>
					</thead>
					<tbody id="documents-tbody"></tbody>
				</table>
			</div>
			<div class="admin-actions" style="justify-content:flex-end; margin: 0;">
				<button id="btn-open-document-modal" type="button" class="admin-btn primary">Добавить документ</button>
			</div>

		</section>

	</main>

	<div id="client-doc-modal-root" class="admin-modal-overlay" hidden aria-hidden="true">
		<div class="admin-modal-backdrop" data-client-doc-dismiss="1" aria-hidden="true"></div>
		<div class="admin-modal-stack">
			<div class="admin-modal admin-modal--docs-fixed" role="dialog" aria-labelledby="client-doc-modal-title">
				<div class="admin-modal-header">
					<h2 id="client-doc-modal-title" class="admin-modal-title">Документ</h2>
					<button type="button" class="admin-modal-close" data-client-doc-dismiss="1" aria-label="Закрыть">×</button>
				</div>
				<form id="documentForm" class="doc-modal-form" novalidate>
					<input type="hidden" id="doc_id" name="document_id">
					<div class="admin-form-grid" style="margin-top: 8px;">
						<div>
							<label for="doc_type" style="display:block;margin-bottom:8px;font-weight:900;">Тип документа</label>
							<select id="doc_type" class="field" required>
								<option value="PASSPORT_RF">Паспорт РФ</option>
								<option value="STUDENT_ID">Студенческий билет</option>
								<option value="PENSION_CERT">Пенсионное удостоверение</option>
							</select>
						</div>
						<div id="doc_field_series">
							<label for="doc_series" style="display:block;margin-bottom:8px;font-weight:900;">Серия</label>
							<input id="doc_series" class="field" type="text" maxlength="20" placeholder="Напр. 4512">
						</div>
						<div>
							<label for="doc_number" style="display:block;margin-bottom:8px;font-weight:900;">Номер</label>
							<input id="doc_number" class="field" type="text" required maxlength="30" placeholder="123456">
						</div>
						<div id="doc_field_issued_by" class="span-2">
							<label for="doc_issued_by" style="display:block;margin-bottom:8px;font-weight:900;">Кем выдан</label>
							<input id="doc_issued_by" class="field" type="text" maxlength="255" placeholder="ОУФМС России...">
						</div>
						<div id="doc_field_issue_date">
							<label for="doc_issue_date" style="display:block;margin-bottom:8px;font-weight:900;">Дата выдачи</label>
							<input id="doc_issue_date" class="field" type="date">
						</div>
						<div id="doc_field_expiry_date">
							<label for="doc_expiry_date" style="display:block;margin-bottom:8px;font-weight:900;">Срок действия</label>
							<input id="doc_expiry_date" class="field" type="date">
						</div>
						<div id="doc_field_notes" class="span-2">
							<label for="doc_notes" style="display:block;margin-bottom:8px;font-weight:900;">Примечания <span class="muted" style="font-weight:700;">(необязательно)</span></label>
							<textarea id="doc_notes" class="field" rows="2" placeholder="Текст примечания" style="resize: vertical;"></textarea>
						</div>
					</div>
					<div class="admin-actions fixed-form-actions" style="margin-top: 14px;">
						<button id="btn-save-document" type="submit" class="admin-btn primary">Сохранить документ</button>
						<button id="btn-reset-document" type="button" class="admin-btn secondary">Очистить</button>
						<button id="btn-delete-document" type="button" class="admin-btn danger" style="display:none;">Удалить документ</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<script src="/js/client-profile-api.js" th:src="@{/js/client-profile-api.js}"></script>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
