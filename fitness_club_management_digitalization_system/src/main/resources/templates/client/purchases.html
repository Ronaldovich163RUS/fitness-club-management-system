<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Клиент — покупки</title>
	<link rel="stylesheet" href="/css/base.css" th:href="@{/css/base.css}">
	<link rel="stylesheet" href="/css/offers.css" th:href="@{/css/offers.css}">
</head>
<body th:attr="data-api-base=@{/api/client}">
	<div th:replace="~{fragments/client-header :: client-header('purchases')}"></div>

	<main class="container">
		<h1 class="page-title" style="margin-top: 34px;">Покупки</h1>

		<section id="membership-cards-section" style="margin-bottom: 24px;">
			<h2 class="section-title">Абонементы</h2>
			<div id="membership-cards" class="grid" aria-label="Абонементы"></div>
		</section>

		<section id="service-cards-section" style="margin-bottom: 24px;">
			<h2 class="section-title">Разовые услуги</h2>
			<div id="service-cards" class="grid" aria-label="Разовые услуги"></div>
		</section>

		<section class="card" style="padding: 20px;">
			<div class="section-title" style="margin: 0 0 12px;">История покупок</div>
			<div class="admin-table-wrap">
				<table class="admin-table" aria-label="История покупок">
					<thead>
						<tr>
							<th>Дата</th>
							<th>Тип</th>
							<th>Наименование</th>
							<th>Цена</th>
						</tr>
					</thead>
					<tbody id="purchase-history-tbody"></tbody>
				</table>
			</div>
		</section>
	</main>

	<script src="/js/club-datetime.js" th:src="@{/js/club-datetime.js}"></script>
	<script src="/js/client-purchases.js" th:src="@{/js/client-purchases.js}"></script>

	<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
