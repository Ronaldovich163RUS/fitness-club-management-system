<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Уведомления</title>
	<link rel="stylesheet" href="/css/base.css" th:href="@{/css/base.css}">
	<link rel="stylesheet" href="/css/admin.css" th:href="@{/css/admin.css}">
</head>
<body th:attr="data-api-base=@{/api/client}">
	<div th:replace="~{fragments/client-header :: client-header('notifications')}"></div>

	<main class="container admin-page">
		<h1 class="page-title" style="margin-top: 34px;">Уведомления</h1>

		<section class="card" style="padding: 20px;">
			<div class="admin-table-wrap">
				<table class="admin-table" aria-label="Уведомления">
					<thead>
						<tr>
							<th>Дата</th>
							<th>От кого</th>
							<th>Роль отправителя</th>
							<th>Заголовок</th>
							<th>Сообщение</th>
						</tr>
					</thead>
					<tbody id="notifications-tbody"></tbody>
				</table>
			</div>
		</section>
	</main>

	<script src="/js/club-datetime.js" th:src="@{/js/club-datetime.js}"></script>
	<script src="/js/client-notifications.js" th:src="@{/js/client-notifications.js}"></script>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
