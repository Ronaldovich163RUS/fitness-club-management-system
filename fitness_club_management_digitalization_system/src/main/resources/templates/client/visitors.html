<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Посетители клуба</title>
	<link rel="stylesheet" href="/css/base.css" th:href="@{/css/base.css}">
	<link rel="stylesheet" href="/css/admin.css" th:href="@{/css/admin.css}">
</head>
<body th:attr="data-api-base=@{/api/client}">
	<div th:replace="~{fragments/client-header :: client-header('visitors')}"></div>

	<main class="container admin-page">
		<h1 class="page-title" style="margin-top: 34px;">Посетители фитнес-клуба</h1>

		<section class="card" style="padding: 32px; text-align: center;">
			<div class="section-title" style="margin-bottom: 12px;">Сейчас в клубе</div>
			<div id="visitors-count" class="summary-value" style="font-size: 3rem; font-weight: 700;">0</div>
			<button type="button" id="btn-refresh-visitors" class="admin-btn secondary" style="margin-top: 16px;">Обновить</button>
		</section>
	</main>

	<script src="/js/client-visitors.js" th:src="@{/js/client-visitors.js}"></script>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
